syntax = "proto3";

package tessera.management.v1;

option go_package = "github.com/EonsofStupid/tessera/pkg/grpc/management/v1;management";

enum LDAPDirectoryProfile {
  LDAP_DIRECTORY_PROFILE_UNSPECIFIED = 0;
  LDAP_DIRECTORY_PROFILE_GENERIC = 1;
  LDAP_DIRECTORY_PROFILE_OPENLDAP = 2;
  LDAP_DIRECTORY_PROFILE_ACTIVE_DIRECTORY = 3;
}

enum LDAPGroupTraversal {
  LDAP_GROUP_TRAVERSAL_UNSPECIFIED = 0;
  LDAP_GROUP_TRAVERSAL_DIRECT = 1;
  LDAP_GROUP_TRAVERSAL_NESTED = 2;
}

enum LDAPOutboundRefusal {
  LDAP_OUTBOUND_REFUSAL_UNSPECIFIED = 0;
  LDAP_OUTBOUND_REFUSAL_INVALID_CONNECTOR = 1;
  LDAP_OUTBOUND_REFUSAL_DIRECTORY_UNAVAILABLE = 2;
  LDAP_OUTBOUND_REFUSAL_TLS_VALIDATION_FAILED = 3;
  LDAP_OUTBOUND_REFUSAL_SERVICE_BIND_FAILED = 4;
  LDAP_OUTBOUND_REFUSAL_USER_NOT_FOUND = 5;
  LDAP_OUTBOUND_REFUSAL_USER_AMBIGUOUS = 6;
  LDAP_OUTBOUND_REFUSAL_INVALID_CREDENTIALS = 7;
  LDAP_OUTBOUND_REFUSAL_USER_DISABLED = 8;
  LDAP_OUTBOUND_REFUSAL_DIRECTORY_SEARCH_FAILED = 9;
  LDAP_OUTBOUND_REFUSAL_INVALID_MAPPING = 10;
  LDAP_OUTBOUND_REFUSAL_RESULT_LIMIT_EXCEEDED = 11;
}

message LDAPOutboundEffects {
  bool authenticate = 1;
  bool import_users = 2;
  bool reconcile = 3;
  bool deprovision = 4;
}

message LDAPAttributeMapping {
  string subject = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  string display_name = 5;
  string email = 6;
  string phone = 7;
}

message LDAPGroupMapping {
  string name = 1;
  string member = 2;
  repeated string object_classes = 3;
  LDAPGroupTraversal traversal = 4;
  uint32 max_depth = 5;
}

message LDAPDisabledUserPolicy {
  string attribute = 1;
  repeated string values = 2;
  uint32 bit_mask = 3;
}

message LDAPOutboundConnector {
  string connector_id = 1;
  string account_id = 2;
  string workspace_id = 3;
  string resource_revision = 4;
  string name = 5;
  LDAPDirectoryProfile profile = 6;
  repeated string endpoints = 7;
  string bind_dn = 8;
  string bind_secret_reference_id = 9;
  string user_base_dn = 10;
  string group_base_dn = 11;
  repeated string user_object_classes = 12;
  repeated string login_attributes = 13;
  LDAPAttributeMapping attributes = 14;
  LDAPGroupMapping groups = 15;
  LDAPDisabledUserPolicy disabled_users = 16;
  LDAPOutboundEffects effects = 17;
  uint32 connect_timeout_ms = 18;
  uint32 search_timeout_ms = 19;
  uint32 result_limit = 20;
  string trust_anchors_pem = 21;
}

message LDAPOutboundUser {
  string dn = 1;
  string subject = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  string display_name = 6;
  string email = 7;
  string phone = 8;
  repeated string groups = 9;
  bool disabled = 10;
}
