syntax = "proto3";

package tessera.management.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/EonsofStupid/tessera/pkg/grpc/management/v1;management";

enum SecretPurpose {
  SECRET_PURPOSE_UNSPECIFIED = 0;
  SECRET_PURPOSE_LDAP_BIND = 1;
  SECRET_PURPOSE_EDGE_TLS = 2;
  SECRET_PURPOSE_PROXY_SESSION = 3;
  SECRET_PURPOSE_OIDC_CLIENT = 4;
  SECRET_PURPOSE_SAML_SIGNING = 5;
  SECRET_PURPOSE_PRIVILEGED_LEASE = 6;
}

enum SecretCustodyState {
  SECRET_CUSTODY_STATE_UNSPECIFIED = 0;
  SECRET_CUSTODY_STATE_PENDING = 1;
  SECRET_CUSTODY_STATE_ACTIVE = 2;
  SECRET_CUSTODY_STATE_ROTATION_DUE = 3;
  SECRET_CUSTODY_STATE_EXPIRED = 4;
  SECRET_CUSTODY_STATE_REVOKED = 5;
  SECRET_CUSTODY_STATE_UNAVAILABLE = 6;
}

message SecretReference {
  string reference_id = 1;
  string account_id = 2;
  string workspace_id = 3;
  SecretPurpose purpose = 4;
  string provider_reference = 5;
  SecretCustodyState state = 6;
  string provider_version = 7;
  string resource_revision = 8;
  google.protobuf.Timestamp rotates_at = 9;
  google.protobuf.Timestamp expires_at = 10;
  string custody_audit_id = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message GetSecretReferenceRequest {
  string reference_id = 1;
}
