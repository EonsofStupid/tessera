name: Source provenance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # Tessera is private and PR authors are trusted operators. If that changes,
    # detach these runners before accepting untrusted pull-request code.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner_label: tessera-linux
          - os: windows
            runner_label: tessera-windows
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify source provenance
        run: |
          go test ./dev/source-inventory
          go run ./dev/source-inventory -check
