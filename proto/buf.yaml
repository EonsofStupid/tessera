version: v1
name: buf.build/nomen/nomen
deps:
  - buf.build/grpc-ecosystem/grpc-gateway
  - buf.build/envoyproxy/protoc-gen-validate
  - buf.build/googleapis/googleapis
breaking:
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
    - ENUM_VALUE_NO_DELETE_UNLESS_NAME_RESERVED
    - ENUM_VALUE_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
    - ENUM_VALUE_NO_DELETE
  ignore_unstable_packages: true
lint:
  use:
    - MINIMAL
  ignore:
    - nomen/action.proto
    - nomen/admin.proto
    - nomen/app.proto
    - nomen/auth_n_key.proto
    - nomen/auth.proto
    - nomen/change.proto
    - nomen/event.proto
    - nomen/feature.proto
    - nomen/idp.proto
    - nomen/instance.proto
    - nomen/management.proto
    - nomen/member.proto
    - nomen/message.proto
    - nomen/metadata.proto
    - nomen/object.proto
    - nomen/options.proto
    - nomen/org.proto
    - nomen/policy.proto
    - nomen/project.proto
    - nomen/quota.proto
    - nomen/settings.proto
    - nomen/system.proto
    - nomen/text.proto
    - nomen/user.proto
    - nomen/v1.proto
