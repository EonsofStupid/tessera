# FIPS runtime overlay: merged on top of defaults.yaml when FIPS 140-3 mode is enabled (GODEBUG=fips140=on|only).
SystemDefaults:
  PasswordHasher:
    Hasher:
      Algorithm: pbkdf2 # TESSERA_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_ALGORITHM
      Rounds: 290000 # TESSERA_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_ROUNDS
      Hash: sha256 # TESSERA_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_HASH
    Verifiers: [] # TESSERA_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS
  SecretHasher:
    Hasher:
      Algorithm: pbkdf2 # TESSERA_SYSTEMDEFAULTS_SECRETHASHER_HASHER_ALGORITHM
      Rounds: 290000 # TESSERA_SYSTEMDEFAULTS_SECRETHASHER_HASHER_ROUNDS
      Hash: sha256 # TESSERA_SYSTEMDEFAULTS_SECRETHASHER_HASHER_HASH
    Verifiers: [] # TESSERA_SYSTEMDEFAULTS_SECRETHASHER_VERIFIERS
